name: Build and publish

# Builds the image with Maven (pom.xml). On main, pushes it to Docker Hub as partnersinhealth/kazakhstan-emr,
# tagged latest and with the pom's version, with openmrs-contrib-distro-tools' build-and-push-docker action.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: github.repository_owner == 'PIH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        if: github.ref != 'refs/heads/main'
        run: mvn -B package

      - name: Build the Docker context
        if: github.ref == 'refs/heads/main'
        run: mvn -B package -Ddocker.skip

      - name: Version
        if: github.ref == 'refs/heads/main'
        id: version
        run: echo "version=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      # CentOS 6 and an x64 JRE: amd64 only
      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: PIH/openmrs-contrib-distro-tools/.github/actions/build-and-push-docker@main
        with:
          image_name: partnersinhealth/kazakhstan-emr
          context: target/distro/web
          version: ${{ steps.version.outputs.version }}
          dockerhub_password: ${{ secrets.DOCKERHUB_PASSWORD }}
          platforms: linux/amd64
