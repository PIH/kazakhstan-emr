# The openmrs service's healthcheck (openmrs-contrib-distro-tools docker/services/openmrs.yaml), answered by
# OpenMRS. Apache starts only once OpenMRS's modules have (entrypoint.sh). Before emr_ssl.conf's ProxyPass /openmrs.
ProxyPass /openmrs/health/started http://localhost:8050/openmrs/ws/rest/v1/session
